name: SonarQube Analysis

on:
  push:
    branches: [ main ]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Debug - Show actual structure
        run: |
          echo "Current Directory:"
          pwd
          echo "=== Files and Folders ==="
          ls -la
          echo "=== All Java files ==="
          find . -name "*.java" | head -50
          echo "Total Java files found:"
          find . -name "*.java" | wc -l

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu'

      - name: Build and analyze with SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B clean verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=appointment123_s123 \
            -Dsonar.organization=appointment123-1 \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.sources=. \
            -Dsonar.java.binaries=target/classes \
            -Dsonar.exclusions=**/target/**,**/*Test.java,**/*.test.*,**/test/**
