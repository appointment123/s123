name: Build and Analyze

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build and SonarCloud Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: 'maven'

      - name: Create .env file for tests
        run: |
          cat > .env << EOF
          EMAIL_USERNAME=${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD=${{ secrets.EMAIL_PASSWORD }}
          EOF

      - name: Build, Test & SonarCloud Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # نستخدم -f لتحديد ملف الـ pom بدقة لتجنب أخطاء المسارات
          mvn -B clean verify sonar:sonar \
            -f appointment_scheduling3/pom.xml \
            -Dsonar.projectKey=appointment123_s123 \
            -Dsonar.organization=appointment123-1 \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.java.binaries=**/target/classes \
            -Dsonar.exclusions="**/presentation_Layer/**,**/target/**,**/doc/**,**/docs/**,**/GenerateHash.java,**/Ù…Ø¬Ù„Ø¯ Ø¬Ø¯ÙŠØ¯/**" \
            -Dsonar.coverage.exclusions="**/src/test/java/**,**/presentation_Layer/**,**/presentation/**,**/connectDB/**,**/main/Main.java,**/service/ReminderService.java"
