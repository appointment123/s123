name: Build and Analyze

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build and SonarCloud Scan
    runs-on: ubuntu-latest

    steps:
      # استخدام الإصدار v4 مباشرة
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # استخدام الإصدار v4 مباشرة
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      # حل مشكلة تسريب الأسرار (Secrets) باستخدام متغيرات البيئة
      - name: Create .env file for tests (Secure)
        env:
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          cat > .env << EOF
          EMAIL_USERNAME=$EMAIL_USERNAME
          EMAIL_PASSWORD=$EMAIL_PASSWORD
          EOF

      - name: Build, Test & Coverage
        run: mvn -B clean verify --file pom.xml

      # استخدام الإصدار v3 من SonarCloud (تأكد أنه v3 لإصدار أحدث)
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v3
        with:
          args: >
            -Dsonar.projectKey=appointment123_s123
            -Dsonar.organization=appointment123-1
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.java.binaries=target/classes
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
            -Dsonar.exclusions=**/presentation_Layer/**,**/target/**,**/doc/**,**/docs/**,**/GenerateHash.java
            -Dsonar.coverage.exclusions=**/src/test/java/**,**/presentation_Layer/**,**/presentation/**,**/connectDB/**,**/main/Main.java,**/service/ReminderService.java
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
